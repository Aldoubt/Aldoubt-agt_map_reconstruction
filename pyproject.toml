[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agt-map-reconstruction"
version = "0.2.0"
description = "Offline LiDAR map reconstruction, plugin benchmarking, and navigation-map validation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "open3d",
    "matplotlib",
    "opencv-python",
    "scipy",
    "pyyaml"
]

[project.optional-dependencies]
test = [
    "pytest>=7,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
